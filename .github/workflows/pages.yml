# Builds the Release benchmarks on a GitHub runner, adds their results to the
# static site in docs/, and publishes it to the gh-pages branch.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build (Release)
        run: |
          cmake --preset release -DTICKFORGE_BUILD_TESTS=OFF
          cmake --build --preset release --target tickforge_bench tickforge_cli
      - name: Build the browser engine (C++ -> WebAssembly)
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.74 > /dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.74 > /dev/null
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build_wasm.sh
      - name: Check the WebAssembly engine matches the native build
        run: |
          ./build/release/tickforge_cli gen "$RUNNER_TEMP/t.tf" 200000 7 > /dev/null
          native=$(./build/release/tickforge_cli backtest "$RUNNER_TEMP/t.tf" | head -1 | sed 's/ .*//')
          wasm=$(node -e "require('./docs/wasm/tickforge.js')().then(M=>{M._tf_generate(200000,7);const p=M._tf_backtest(500,1.0,0.25,0.0005,0.1,0,1);console.log('pnl='+new Float64Array(M.HEAPF64.buffer,p,1)[0].toFixed(2))})")
          echo "native: $native  wasm: $wasm"
          test "$native" = "$wasm"
      - name: Run benchmarks
        run: |
          ./build/release/tickforge_bench --benchmark_min_time=0.5s \
            --benchmark_out=bench.json --benchmark_out_format=json
          python3 scripts/bench_to_site.py bench.json docs/data/bench-ci.json \
            --label "GitHub Actions ubuntu-24.04 runner" --compiler "$($CXX --version | head -1)" --commit "$GITHUB_SHA"
      - name: Publish docs/ to gh-pages
        run: |
          cd docs
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Henry Zhang"
          git config user.email "2763638+henryzhangpku@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Fail the workflow unless the live site serves this commit's data.
      - name: Verify the live site
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for i in $(seq 1 60); do
            if curl -fsS "$url/data/bench-ci.json?nocache=$i" | grep -q "\"commit\": \"$GITHUB_SHA\""; then
              curl -fsS -o /dev/null -w "index.html: HTTP %{http_code}\n" "$url/"
              echo "live: $url serves $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "site did not update within 10 minutes"; exit 1
